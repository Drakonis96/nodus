<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nodus Copilot</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <link rel="stylesheet" href="/addin/taskpane.css" />
    <script>
      // Injected by the Nodus copilot server when it serves this page.
      window.NODUS = { token: '__COPILOT_TOKEN__', lang: '__COPILOT_LANG__' };
    </script>
  </head>
  <body>
    <header class="head">
      <img class="mark" src="/addin/assets/icon-32.png" alt="Nodus" width="28" height="28" />
      <div>
        <div class="title">Nodus Copilot</div>
        <div class="caption">Word + Nodus</div>
      </div>
      <div id="status" class="status">Connecting…</div>
    </header>

    <main>
      <section class="controls">
        <div class="search">
          <input id="searchBox" type="search" placeholder="Search ideas, authors or works" autocomplete="off" />
          <button id="searchBtn" class="btn icon" type="button" title="Search">⌕</button>
        </div>
        <div class="segmented" id="searchMode" role="tablist">
          <button class="seg active" data-mode="ideas" type="button" role="tab">Ideas</button>
          <button class="seg" data-mode="passages" type="button" role="tab">Passages</button>
          <button class="seg" data-mode="references" type="button" role="tab">References</button>
        </div>
        <div id="analysisControls">
          <div class="toolbar">
            <label class="auto"><input type="checkbox" id="autoToggle" checked /> Auto</label>
            <button id="analyzeBtn" class="btn primary" type="button">Analyze paragraph</button>
          </div>
          <div class="selection-actions" id="selectionActions">
            <span class="sa-label">Selection</span>
            <button class="btn small" data-compose="rewrite" type="button">Rewrite</button>
            <button class="btn small" data-compose="expand" type="button">Expand</button>
            <button class="btn small" data-compose="counter" type="button">Counter</button>
          </div>
          <div class="insert-target" id="insertTarget">
            <span class="it-label">Insert into</span>
            <label><input type="radio" name="insTarget" value="body" checked /> <span data-it="body">Body</span></label>
            <label id="footnoteOption"><input type="radio" name="insTarget" value="footnote" id="footnoteRadio" /> <span data-it="footnote">Footnote</span></label>
          </div>
        </div>

        <section id="referenceControls" class="reference-controls" hidden aria-label="Reference tools">
          <div class="reference-preferences">
            <label class="reference-style-field"><span data-ref-label="style">Style</span><input id="referenceStyleSearch" type="search" autocomplete="off" placeholder="Search citation styles" aria-label="Search citation styles" /><select id="referenceStyle"></select></label>
            <label><span data-ref-label="locale">Language</span><select id="referenceLocale">
              <option value="es-ES">Spanish</option><option value="en-US">English</option>
              <option value="fr-FR">French</option><option value="de-DE">German</option>
              <option value="it-IT">Italian</option><option value="pt-PT">Portuguese</option>
            </select></label>
            <label><span data-ref-label="placement">Placement</span><select id="referencePlacement">
              <option value="in-text">In text</option><option value="footnote">Footnote</option><option value="endnote">Endnote</option>
            </select></label>
          </div>
          <label class="auto reference-auto"><input type="checkbox" id="referenceAutoUpdate" checked /> <span>Update citations automatically</span></label>
          <div class="reference-document-actions">
            <button id="refreshReferences" class="btn small" type="button" title="Update every live citation and bibliography">↻ <span>Refresh</span></button>
            <button id="unlinkReferences" class="btn small danger" type="button" title="Convert live references to plain text">⌁ <span>Unlink</span></button>
          </div>
          <div id="citationComposer" class="citation-composer">
            <div class="composer-head"><strong>Current citation</strong><span id="composerHint">Choose one or more sources below</span></div>
            <div id="selectedReferences" class="selected-references"></div>
            <div class="composer-actions">
              <button id="clearCitation" class="btn small" type="button">Clear</button>
              <button id="insertCitation" class="btn small primary" type="button" disabled>Insert citation</button>
            </div>
          </div>
          <div class="bibliography-actions">
            <div><strong>Bibliography</strong><small id="bibliographyHint">Uses the sources cited in this document</small></div>
            <button id="insertBibliography" class="btn small" type="button">Insert / update</button>
          </div>
        </section>
      </section>

      <div id="paragraph" class="paragraph"></div>
      <div id="results" class="results"></div>
      <div id="empty" class="empty">Place the cursor in a paragraph to see related ideas.</div>
    </main>

    <script src="/addin/references.js"></script>
    <script src="/addin/taskpane.js"></script>
  </body>
</html>
