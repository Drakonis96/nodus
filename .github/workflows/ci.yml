name: CI

# Runs the full quality gate on pull requests and pushes to main: typecheck + renderer
# and main builds, the unit/integration suite (node --test discovers
# scripts/test-*.mjs and runs them in parallel; scripts that need better-sqlite3
# re-exec themselves under Electron-as-Node to match the app ABI), and the e2e
# smoke that boots the real app. macOS runner: same platform as development,
# and Electron can open real windows there without xvfb.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # Keep only the newest run for a PR branch (or main) without creating a
  # second, cancelled check for every commit pushed to an open PR.
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Sitemap freshness is derived from the latest commit touching each
          # content source, so the test needs history rather than a shallow tip.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Verify citation metadata
        run: npm run citation:check

      - name: Install dependencies
        run: npm ci

      # The test suite re-execs under Electron-as-Node, so native modules
      # (better-sqlite3) must match Electron's ABI, not the system Node's.
      - name: Rebuild native modules for Electron
        run: npx electron-builder install-app-deps

      - name: Lint
        run: npm run lint

      - name: Build (includes typecheck)
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build

      # The Server Web suites drive the compiled app and ask the server for its SPA
      # shell, so without this the published-record routes answer 404 and the
      # Chromium checks have nothing to open.
      - name: Build the Server Web bundle
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build:server-web

      - name: Unit and integration tests
        run: npm test

      - name: E2E smoke (real app boot)
        timeout-minutes: 10
        run: npm run test:e2e
